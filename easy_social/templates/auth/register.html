{% extends "base.html" %}
{% block title %}Register - 陳品翔's Easy Social{% endblock %}
{% block content %}
  <section class="auth-panel">
    <h1>Create account</h1>
    <form method="post" class="form-stack">
      <label>
        Username
        <input name="username" maxlength="40" autocomplete="username" required>
      </label>
      <label>
        Email
        <input name="email" type="email" autocomplete="email" required>
      </label>
      <label>
        Password
        <input name="password" type="password" autocomplete="new-password" required>
      </label>
      <div class="captcha-group">
        <label for="captcha-input">CAPTCHA</label>
        <div class="captcha-row">
          <img id="captcha-img" src="{{ url_for('auth.captcha_image') }}" alt="CAPTCHA" style="border-radius:4px;">
          <button type="button" id="refresh-captcha" class="link-button" aria-label="Refresh CAPTCHA">&#x21bb; Refresh</button>
        </div>
        <input id="captcha-input" name="captcha" autocomplete="off" placeholder="Enter the characters above" required>
      </div>
      <button type="submit">Register</button>
    </form>
    <p class="muted">Already registered? <a href="{{ url_for('auth.login') }}">Log in</a>.</p>
  </section>
  <script>
    document.getElementById('refresh-captcha').addEventListener('click', function () {
      var img = document.getElementById('captcha-img');
      img.src = "{{ url_for('auth.captcha_image') }}?" + Date.now();
    });
  </script>
{% endblock %}
